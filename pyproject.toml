[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cinema-theatre-review"
version = "1.0.0"
description = "Editorial OS and Data/Editorial Core v1.0 for Persian-language curated international cinema & theatre review."
authors = [{ name = "Cinema & Theatre Review Editorial Team" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "google-genai>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff.lint]
ignore = ["BLE001", "SIM102", "PIE810", "C414"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "editorial*",
    "evidence*",
    "loaders*",
    "projection*",
    "schemas*",
    "utils*"
]
exclude = ["tests*"]
namespaces = true

[tool.setuptools.package-data]
config = ["**/*.json"]
